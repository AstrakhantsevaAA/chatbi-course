[project]
name = "chatbi-course"
version = "0.1.0"
description = "ChatBI on your warehouse: reference solution for the dltHub Academy course"
requires-python = ">=3.11"
dependencies = [
    "dlt[hub,parquet,deltalake,duckdb,s3]==1.32.0",
    "dlthub>=0.27.0,<1",
    "dlthub-client>=0.27.7,<1",
    "duckdb>=0.9,<2",
    "ibis-framework>=12.0.0",
    "pyarrow>=16.0.0",
    "marimo>=0.14.5",
    "fastmcp>=3.1.0",
    "mowidgets>=0.2.1 ; python_version >= '3.11'",
    "pathspec>=0.11.2",
    "pydbml>=1.2.0",
    "s3fs>=2022.4.0",
    "pandas>=3.1.1",
    "numpy>=2.4.6",
    "altair>=6.3.0",
]

[dependency-groups]
agent-loop-pydantic-ai = [
    "pydantic-ai-slim[anthropic,google,mcp,openai,spec]>=2.73.0",
]
